services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - evidence-network

  backend:
    build:
      context: ./backend
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - evidence-network

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    networks:
      - evidence-network
    env_file:
      - ./ai-service/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  
  redis:
    image: redis:8
    ports: 
      - "6379:6379"
    networks:
      - evidence-network
  

networks:
  evidence-network: